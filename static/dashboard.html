<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flowithgo dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 2rem; }
    h1 { font-size: 1.4rem; color: #fff; margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 2rem; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1.25rem; }
    .stat-label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .stat-value { font-size: 2rem; font-weight: bold; }
    .queued .stat-value { color: #60a5fa; }
    .running .stat-value { color: #fbbf24; }
    .done .stat-value { color: #34d399; }
    .failed .stat-value { color: #f87171; }
    .section-title { font-size: 0.85rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .events { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1.25rem; max-height: 400px; overflow-y: auto; margin-bottom: 2rem; }
    .event { padding: 0.5rem 0; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; display: flex; gap: 1rem; align-items: baseline; }
    .event:last-child { border-bottom: none; }
    .event-time { color: #666; font-size: 0.75rem; min-width: 80px; }
    .event-type { padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
    .event-type.claimed { background: #1e3a5f; color: #60a5fa; }
    .event-type.completed { background: #064e3b; color: #34d399; }
    .event-type.failed { background: #450a0a; color: #f87171; }
    .event-msg { color: #ccc; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 0.5rem; }
    .status-dot.disconnected { background: #f87171; }
    .connection-status { font-size: 0.75rem; color: #666; margin-bottom: 1rem; display: flex; align-items: center; }
    .empty { color: #444; font-size: 0.85rem; padding: 1rem 0; }

    /* DLQ styles */
    .dlq-table { width: 100%; border-collapse: collapse; }
    .dlq-table th { text-align: left; font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2a2a; }
    .dlq-table td { font-size: 0.82rem; padding: 0.6rem 0.75rem; border-bottom: 1px solid #1f1f1f; color: #ccc; vertical-align: middle; }
    .dlq-table tr:last-child td { border-bottom: none; }
    .dlq-table tr:hover td { background: #1f1f1f; }
    .dlq-wrap { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1.25rem; margin-bottom: 2rem; }
    .dlq-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .requeue-btn { background: #1e3a5f; color: #60a5fa; border: 1px solid #2a5a8f; border-radius: 4px; padding: 0.25rem 0.75rem; font-size: 0.75rem; font-family: monospace; cursor: pointer; }
    .requeue-btn:hover { background: #2a4a6f; }
    .requeue-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .refresh-btn { background: transparent; color: #666; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0.25rem 0.75rem; font-size: 0.75rem; font-family: monospace; cursor: pointer; }
    .refresh-btn:hover { color: #ccc; border-color: #444; }
    .error-text { color: #f87171; font-size: 0.75rem; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .id-text { color: #666; font-size: 0.72rem; }
    .attempts-text { color: #fbbf24; }
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: #064e3b; color: #34d399; border: 1px solid #34d399; border-radius: 6px; padding: 0.75rem 1.25rem; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>flowithgo</h1>
  <p class="subtitle">distributed task queue — real-time monitor</p>

  <div class="stats">
    <div class="stat-card queued">
      <div class="stat-label">Queued</div>
      <div class="stat-value" id="stat-queued">—</div>
    </div>
    <div class="stat-card running">
      <div class="stat-label">Running</div>
      <div class="stat-value" id="stat-running">—</div>
    </div>
    <div class="stat-card done">
      <div class="stat-label">Done</div>
      <div class="stat-value" id="stat-done">—</div>
    </div>
    <div class="stat-card failed">
      <div class="stat-label">Failed</div>
      <div class="stat-value" id="stat-failed">—</div>
    </div>
  </div>

  <!-- DLQ Section -->
  <div class="dlq-wrap">
    <div class="dlq-header">
      <div class="section-title" style="margin-bottom:0">Dead Letter Queue</div>
      <button class="refresh-btn" onclick="fetchDLQ()">↻ refresh</button>
    </div>
    <table class="dlq-table">
      <thead>
        <tr>
          <th>Job ID</th>
          <th>Type</th>
          <th>Attempts</th>
          <th>Last Error</th>
          <th>Failed At</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="dlq-body">
        <tr><td colspan="6" class="empty">loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="connection-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">connecting...</span>
  </div>

  <div class="section-title">Live Events</div>
  <div class="events" id="events">
    <div class="empty">waiting for events...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function fetchStats() {
      try {
        const res = await fetch('/stats');
        const data = await res.json();
        document.getElementById('stat-queued').textContent = data.queued ?? 0;
        document.getElementById('stat-running').textContent = data.running ?? 0;
        document.getElementById('stat-done').textContent = data.done ?? 0;
        document.getElementById('stat-failed').textContent = data.failed ?? 0;
      } catch (e) {
        console.error('failed to fetch stats', e);
      }
    }

    async function fetchDLQ() {
      try {
        const res = await fetch('/dlq');
        const jobs = await res.json();
        const tbody = document.getElementById('dlq-body');

        if (!jobs || jobs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">no dead jobs</td></tr>';
          return;
        }

        tbody.innerHTML = jobs.map(job => `
          <tr id="dlq-row-${job.id}">
            <td class="id-text">${job.id.split('-')[0]}...${job.id.split('-')[4]}</td>
            <td>${job.type}</td>
            <td class="attempts-text">${job.attempts} / ${job.max_attempts}</td>
            <td class="error-text" title="${job.last_error?.String ?? ''}">${job.last_error?.String ?? '—'}</td>
            <td class="id-text">${new Date(job.updated_at).toLocaleTimeString()}</td>
            <td><button class="requeue-btn" onclick="requeueJob('${job.id}', this)">requeue</button></td>
          </tr>
        `).join('');
      } catch (e) {
        console.error('failed to fetch dlq', e);
      }
    }

    async function requeueJob(id, btn) {
      btn.disabled = true;
      btn.textContent = 'requeuing...';
      try {
        const res = await fetch(`/dlq/${id}/requeue`, { method: 'POST' });
        if (res.ok) {
          const row = document.getElementById(`dlq-row-${id}`);
          if (row) row.remove();
          showToast('job requeued successfully');
          fetchStats();
          const tbody = document.getElementById('dlq-body');
          if (tbody.children.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty">no dead jobs</td></tr>';
          }
        } else {
          btn.disabled = false;
          btn.textContent = 'requeue';
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'requeue';
      }
    }

    fetchStats();
    fetchDLQ();

    const eventsEl = document.getElementById('events');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    let firstEvent = true;

    const es = new EventSource('/events');

    es.onopen = () => {
      statusDot.classList.remove('disconnected');
      statusText.textContent = 'connected';
    };

    es.onerror = () => {
      statusDot.classList.add('disconnected');
      statusText.textContent = 'disconnected — retrying...';
    };

    es.onmessage = (e) => {
      const event = JSON.parse(e.data);
      fetchStats();

      // refresh DLQ when a job fails finally
      if (event.type === 'job_failed') fetchDLQ();

      if (firstEvent) {
        eventsEl.innerHTML = '';
        firstEvent = false;
      }

      const time = new Date().toLocaleTimeString();
      const typeClass = event.type === 'job_claimed' ? 'claimed'
        : event.type === 'job_completed' ? 'completed'
        : event.type === 'job_failed' ? 'failed' : '';

      const label = event.type.replace('job_', '').replace('_', ' ');
      const payload = event.payload;

      const el = document.createElement('div');
      el.className = 'event';
      el.innerHTML = `
        <span class="event-time">${time}</span>
        <span class="event-type ${typeClass}">${label}</span>
        <span class="event-msg">${payload.job_id ?? ''} — ${payload.type ?? ''} ${payload.error ? '— ' + payload.error : ''}</span>
      `;

      eventsEl.insertBefore(el, eventsEl.firstChild);
      while (eventsEl.children.length > 50) {
        eventsEl.removeChild(eventsEl.lastChild);
      }
    };
  </script>
</body>
</html>
